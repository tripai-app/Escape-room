<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06060f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOVA Protocol" />
    <meta name="description" content="Multiplayer Escape Room – Rettet die Welt vor HERALD!" />
    <title>NOVA Protocol</title>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #06060f;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 1.5rem;
        font-family: 'Orbitron', monospace;
        transition: opacity 0.6s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-logo {
        font-size: clamp(2rem, 10vw, 3.5rem);
        font-weight: 900;
        color: #00e5ff;
        text-shadow: 0 0 30px rgba(0,229,255,0.6), 0 0 60px rgba(0,229,255,0.3);
        letter-spacing: 0.15em;
        animation: splashPulse 2s ease-in-out infinite;
      }
      #splash-sub {
        font-size: clamp(0.6rem, 3vw, 0.8rem);
        color: #7b82b8;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-family: 'Share Tech Mono', monospace;
      }
      #splash-bar {
        width: 180px; height: 2px;
        background: #1e1e3f;
        border-radius: 2px;
        overflow: hidden;
      }
      #splash-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #00e5ff, #ff2255);
        border-radius: 2px;
        animation: splashLoad 1.4s ease forwards;
      }
      @keyframes splashPulse {
        0%, 100% { text-shadow: 0 0 30px rgba(0,229,255,0.6), 0 0 60px rgba(0,229,255,0.3); }
        50% { text-shadow: 0 0 50px rgba(0,229,255,0.9), 0 0 90px rgba(0,229,255,0.5); }
      }
      @keyframes splashLoad {
        0% { width: 0%; }
        60% { width: 70%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Ladescreen -->
    <div id="splash">
      <div id="splash-logo">NOVA</div>
      <div id="splash-sub">Protocol · wird geladen</div>
      <div id="splash-bar"><div id="splash-fill"></div></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Ladescreen ausblenden sobald React geladen hat
      window.addEventListener('load', function () {
        setTimeout(function () {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function () { splash.remove(); }, 700);
          }
        }, 800);
      });
    </script>
  </body>
</html>
